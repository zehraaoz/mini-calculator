<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="calculator">
        <h1>My Calculator</h1>
        <button id="themeToggle">Dark Mode</button>
        <input type="number" id="number1" placeholder="First number">
        <input type="number" id="number2" placeholder="Second number">

        <div class="buttons">
            <button id="add" data-operator="+">+</button>
            <button id="subtract" data-operator="-">-</button>
            <button id="multiply" data-operator="*">*</button>
            <button id="divide" data-operator="/">/</button>
            <button id="clear">Clear</button>
            
        </div>
        <h2 id="result">Result: </h2>
    </div>
    

    
    
</body>
</html>
